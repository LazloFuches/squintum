<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectory Art House 2026</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --warm: #E8A832;
  --cool: #6B8FA3;
  --vibrant: #E85D30;
  --dark: #1E2832;
  --bg: #E8E6E1;
  --rule: #C8C5BF;
  --muted: #6A6862;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--dark);
  font-size: 16px;
  line-height: 1.6;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 64px 32px 80px;
}

.masthead {
  margin-bottom: 8px;
}

.masthead h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 42px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.03em;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 12px 0;
  border-top: 3px solid var(--dark);
  border-bottom: 1px solid var(--rule);
}

.content {
  margin-top: 40px;
}

.content p {
  font-size: 15px;
  color: var(--muted);
  max-width: 560px;
}

footer {
  margin-top: 64px;
  padding-top: 16px;
  border-top: 3px solid var(--dark);
}

footer a {
  color: var(--dark);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

footer a:hover {
  border-color: var(--vibrant);
}

.copyright {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

@media (max-width: 560px) {
  .page { padding: 40px 20px 60px; }
  .masthead h1 { font-size: 32px; }
}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1>Rectory Art House 2026</h1>
  </header>
  <div class="masthead-meta">
    <span>Open Studio Floor Plan</span>
    <span></span>
  </div>

  <div class="content">
    <p>Content coming soon.</p>
  </div>

  <footer>
    <p class="copyright"><a href="https://squintum.com">squintum.com</a></p>
  </footer>

</div>
</body>
</html>
